services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/litera
    ports:
      - '4000:4000'
    depends_on:
      - mongo
volumes:
  mongo-data:
